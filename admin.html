<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SupplyTrack | Admin</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js" defer></script>
    <script src="firebase-config.js" defer></script>
    <script src="data.js" defer></script>
    <script src="products.js" defer></script>
    <script src="admin.js" defer></script>
</head>
<body>
    <div class="topmostnav">
        <a class="logoall" href="index.html"><img class="brand-logo-img" src="logo.svg" alt="SupplyTrack logo"><div class="logo-text">SupplyTrack · Admin</div></a>
        <div class="nav-links"><a href="index.html">Student site</a></div>
    </div>
    <div class="page">
        <form id="gate" class="gate">
            <h2>Admin sign-in</h2>
            <input id="login-email" type="email" placeholder="Email" aria-label="Email" autocomplete="username">
            <input id="login-password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password">
            <small class="err" id="login-err"></small>
            <button class="btn" type="submit">Sign in</button>
        </form>
        <div id="main" class="hidden">
            <div class="page-head"><div><p class="catalogheadsmall">SHOP VIEW</p><h2 class="catalogheadbig">Admin dashboard</h2></div>
                <button class="btn" id="lock-btn" type="button">Sign out</button></div>
            <section class="notice" style="margin:0 0 8px"><b>LIVE:</b> reservations from students on ANY device show up here by themselves.</section>
            <p class="tiny" id="sync-note"></p>
            <div class="stats">
                <div class="stat"><span>Pending</span><strong id="pending-count">0</strong></div>
                <div class="stat"><span>Confirmed / Preparing</span><strong id="active-count">0</strong></div>
                <div class="stat"><span>Ready for pickup</span><strong id="ready-count">0</strong></div>
            </div>
            <div class="inline-form">
                <input id="req-search" placeholder="Search code, name or student ID" aria-label="Search requests">
                <select id="filter" class="catalogdropdown" aria-label="Filter by status"></select>
            </div>
            <div id="reservations-list" class="reservation-list"></div>

            <h3>Products</h3>
            <form id="add-form" class="inline-form">
                <input id="new-name" placeholder="Product name" aria-label="Product name">
                <input id="new-category" list="cats" placeholder="Category" aria-label="Category">
                <datalist id="cats"></datalist>
                <input id="new-price" type="number" min="0.01" step="0.01" placeholder="Price" aria-label="Price">
                <label class="mini">Max per student <input id="new-max" type="number" min="1" max="50" value="10"></label>
                <select id="new-avail" class="catalogdropdown" aria-label="Availability"><option>Available</option><option>Limited</option><option>Unavailable</option></select>
                <button class="btn" type="submit">Add product</button>
            </form>
            <small class="err" id="add-err"></small>
            <button class="btn hidden" id="sample-btn" type="button">Load the 12 sample products</button>
            <div id="product-list"></div>
        </div>
    </div>
    <footer class="footer"><h1>SupplyTrack</h1><p>Admin area</p></footer>
</body>
</html>
